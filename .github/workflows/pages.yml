name: Deploy Ocean Academy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v6
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Prepare static app
        env:
          OA_SUPABASE_URL: ${{ secrets.OA_SUPABASE_URL }}
          OA_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.OA_SUPABASE_PUBLISHABLE_KEY }}
        run: |
          mkdir -p _site
          cp index.html _site/
          cp -r assets js _site/
          node scripts/write-public-config.js _site/js/config.js
          touch _site/.nojekyll
      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Deploy site
        id: deployment
        uses: actions/deploy-pages@v4
